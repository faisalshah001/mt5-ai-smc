name: CI

# No deployment workflow exists in this repository by design -- this
# workflow is verification-only (tests, lint, format, typecheck).
#
# Runner note: MetaTrader5 (a direct runtime dependency, imported at
# module load time by main.py / app/mt5/*) ships Windows-only wheels
# (win_amd64), so every job below runs on windows-latest. There is no
# Linux/macOS leg to add "for completeness" -- the dependency does not
# support it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        # MetaTrader5==5.0.5735 publishes wheels for cp310-cp314;
        # pandas==3.0.5 requires Python >=3.11 -- 3.11/3.12/3.13 is
        # the full supported range for this pinned dependency set.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run test suite
        run: pytest -v --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          echo "## Test results -- Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("junit-${{ matrix.python-version }}.xml").getroot()
          suite = root.find("testsuite") if root.tag != "testsuite" else root
          print(
              f"- tests: {suite.get('tests')}\n"
              f"- failures: {suite.get('failures')}\n"
              f"- errors: {suite.get('errors')}\n"
              f"- skipped: {suite.get('skipped')}\n"
              f"- time: {suite.get('time')}s"
          )
          PY

  determinism:
    name: Determinism (double-run + reverse order)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      # Every pipeline function is required to be a pure function of
      # its input (docs/ARCHITECTURE.md #2.1) -- running the full
      # suite twice, then once more in reverse file order, is this
      # project's standing regression gate for that guarantee
      # (docs/TESTING.md #2). A difference between any of these three
      # runs is a determinism regression, not a flaky test.
      - name: Run 1
        run: pytest -q

      - name: Run 2 (repeat, same order)
        run: pytest -q

      - name: Run 3 (reverse file order)
        shell: bash
        run: |
          files=$(ls tests/test_*.py | sort -r)
          pytest -q $files

  golden-verification:
    name: Golden-file regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      # Golden files (tests/golden/*.json) are the committed,
      # hand-approved snapshots every pipeline stage's output is
      # compared against -- see docs/TESTING.md #4. This job isolates
      # exactly the tests that perform that comparison, so a golden
      # regression is reported under its own clearly-named check
      # rather than buried in the full suite's result.
      - name: Run golden-file tests
        run: pytest -v -k "golden"

  lint:
    name: Lint (ruff)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.16.0

      # Enforces this repository's pyproject.toml [tool.ruff.lint]
      # select set (E4, E7, E9, F) against production code, which is
      # already fully clean -- a genuine, blocking gate. Scoped to
      # app/ and main.py only: tests/ currently has a few trivial,
      # pre-existing violations (unused imports, one ambiguous
      # variable name) left untouched per this phase's "do not modify
      # tests" constraint -- see the Release Engineering deliverables
      # for the exact list. Extending this gate to tests/ is a
      # trivial, separate follow-up.
      - name: Run ruff
        run: ruff check app/ main.py

  format-check:
    name: Format check (black)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install black
        run: pip install black==26.5.1

      # Informational for this initial release: this codebase's
      # existing, deliberately vertical formatting style predates
      # black and does not match its output today (see pyproject.toml
      # [tool.black]'s note and docs/ for the full rationale).
      # continue-on-error keeps this check visible without blocking
      # merges until a dedicated, separately-approved reformatting
      # pass is done.
      - name: Run black --check
        run: black --check --diff app/ main.py tests/

  typecheck:
    name: Type check (mypy)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install mypy
        run: pip install mypy==2.3.0 pandas-stubs

      # Informational for this initial release: findings are
      # predominantly pandas/Literal-narrowing limitations, not
      # confirmed runtime defects -- the passing, golden-verified test
      # suite is this pipeline's actual correctness signal (see
      # docs/TESTING.md). continue-on-error keeps this check visible
      # without blocking merges until a dedicated typing-hardening
      # pass is done.
      - name: Run mypy
        run: mypy app/ main.py
